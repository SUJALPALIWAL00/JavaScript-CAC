<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Selector</title>
    <style>
        .bgblack {
            background-color: #17181C;
            color: white;
        }
        .orgcolor {
            color: #FC7501;
        }
        #heading{
            font-size: 45px;
            text-align: center;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bgblack">
    <h1 id="heading" class="orgcolor">DOM Selector <span>with Sujal Paliwal</span></h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <ul>
        <li class="list-item">Home</li>
        <li class="list-item">About Us</li>
        <li class="list-item">Contact Us</li>
    </ul>
    
</body>
</html>
