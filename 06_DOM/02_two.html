<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent and child relationship</title>
    <style>
        body{
            background-color: #212121;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">Monday</div>
        <div class="child">Tuesday</div>
        <div class="child">Wednesday</div>
        <div class="child">Thursdy</div>
        <div class="child">Friday</div>
        <div class="child">Saturday</div>
        <div class="child">Sunday</div>
    </div>
    <script>
        let parent = document.querySelector(".parent")
        console.log(parent);
        console.log(parent.children);    // It gives us a HTML collection
        console.log(parent.children[1].innerText); 
        let mondayElement = parent.children[0];
        
        for (let i = 0; i < parent.children.length; i++) {
            console.log(parent.children[i].innerText); 
        }
       mondayElement.style.color = "green";
       console.log(parent.firstElementChild);
       console.log(parent.lastElementChild);

       console.log(mondayElement.parentElement);
       console.log(mondayElement.nextElementSibling);
       console.log(mondayElement.previousElementSibling);
       
       console.log(parent.childNodes);
       
    </script>
</body>
</html>
