<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            background-color: cadetblue;
            text-align: center;
        }

        h1 {
            text-align: center;
        }

        form {
            text-align: center;
        }

        input {
            margin: 10px;
        }
        #result{
            height: 40px;
        }
        #verdict{
            display: inline-block;
            padding: 5px 10px;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <h1>BMI Calculator</h1>
    <form action="">
        <label for="height">Height in cm:- </label><input type="number" id="height"><br>
        <label for="weight">Weight in kg:- </label><input type="number" id="weight"><br>
        <input type="submit" value="Calculate" id="btn">
    </form>
    <div id="result"></div>
    <div class="guidelines">
        <h2>BMI Chart</h2>
        <p>Less than 18.6 = underweight</p>
        <p>18.6-24.9 = Normal</p>
        <p>More than 24.9 = Overweight</p>
    </div>
    <p id="verdict"></p>

    <script>
        let form = document.querySelector('form')
        let verdict = document.getElementById('verdict')
        form.addEventListener('submit', (e) => {
            e.preventDefault()

            let height = document.getElementById('height').value
            let weight = document.getElementById('weight').value
            let result = document.getElementById('result')

            if (height == "" || height <= 0 || isNaN(height)) {
                result.innerHTML = "Please enter a valid height"
            } else if (weight == "" || weight <= 0 || isNaN(weight)) {
                result.innerHTML = "Please enter a valid weight"
            } else {
                var bmi = (weight / ((height * height) / 10000)).toFixed(2)
                result.innerHTML = `Your BMI is ${bmi}`
            }

            if (bmi < 18.6){
                verdict.innerHTML = "You are Underweight"
                verdict.style.backgroundColor = "Yellow"
            }else if (bmi >= 18.6 && bmi<24.9){
                verdict.innerHTML = "Your BMI is normal "
                verdict.style.backgroundColor = "green"

            }else{
                verdict.innerHTML = "You are Overweight"
                verdict.style.backgroundColor = "red"

            }

        })
    </script>
</body>

</html>
